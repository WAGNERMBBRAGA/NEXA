<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nexa - Compilador e Executor de Código</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1e1e1e; color: #d4d4d4; min-height: 100vh; display: flex; flex-direction: column; }
    header { background: #0e639c; padding: 15px 20px; border-bottom: 2px solid #1a7cc8; }
    header h1 { color: white; font-size: 24px; margin-right: 40px; }
    .main-container { display: flex; flex: 1; height: calc(100vh - 65px); }
    .editor-pane, .output-pane { flex: 1; display: flex; flex-direction: column; border-right: 1px solid #444; min-width: 300px; max-width: 80%; }
    .editor-pane { background: #2d2d2d; }
    textarea#code-input { width: 100%; height: calc(100% - 50px); background: #1e1e1e; color: #4ec9b0; border: none; padding: 15px; font-family: 'Consolas', 'Courier New', monospace; font-size: 14px; resize: none; outline: none; }
    .output-pane { background: #000; }
    .output-pane h2 { color: #d4d4d4; padding: 10px 15px; border-bottom: 1px solid #333; margin-top: 0; font-size: 16px; display: flex; align-items: center; justify-content: space-between; }
    .output-pane h2 .label { background: #1a7cc8; padding: 4px 10px; border-radius: 3px; font-size: 12px; color: white; text-transform: uppercase; letter-spacing: 1px; }
    #output-content { flex: 1; overflow-y: auto; padding: 15px; font-family: 'Consolas', 'Courier New', monospace; font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-all; }
    .btn-container { background: #2d2d2d; padding: 10px 15px; border-top: 1px solid #333; display: flex; gap: 10px; justify-content: center; }
    button.action-btn { padding: 10px 24px; background: #0e639c; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; transition: all 0.2s; }
    button.action-btn:hover { background: #1a7cc8; transform: translateY(-1px); box-shadow: 0 3px 10px rgba(0,0,0,0.3); }
    button.action-btn:active { transform: translateY(0); }
    .status-bar { background: #333; padding: 5px 15px; font-size: 12px; color: #888; border-top: 1px solid #444; display: flex; justify-content: space-between; align-items: center; }
    .status-badge { background: #0e639c; padding: 3px 10px; border-radius: 3px; font-size: 12px; color: white; }
    .loading { opacity: 0.7; pointer-events: none; }
    pre { margin: 0; background: transparent; color: inherit; }
    code { font-family: 'Consolas', monospace; }
    #output-content.error { border-left: 4px solid #f14c4c; padding-left: 10px; }
    #output-content.success { border-left: 4px solid #4ec9b0; padding-left: 10px; }
    .debug-info { margin-top: 15px; background: #1a3a2e; border-radius: 5px; padding: 10px; font-size: 12px; color: #88c968; max-height: 200px; overflow-y: auto; }
    .debug-label { display: block; margin-bottom: 8px; color: #ccc; text-transform: uppercase; font-size: 11px; letter-spacing: 1px; }
  </style>
</head>
<body>
  <header>
    <h1>Nexa — Compilador e Executor de Código</h1>
  </header>

  <div class="main-container">
    <div class="editor-pane">
      <textarea id="code-input" placeholder="// Digite seu código Rust aqui...&#10;&#10;fn main() {&#10;&nbsp;&nbsp;&nbsp; // Escreva sua lógica&#10;&nbsp;&nbsp;}"></textarea>
      <div class="btn-container">
        <button id="run-btn" class="action-btn">▶ Executar Código</button>
        <button id="compile-btn" class="action-btn">🔨 Compilar</button>
      </div>
    </div>

    <div class="output-pane">
      <h2><span class="label">Saída do Programa</span></h2>
      <pre><code id="output-content">Esperando execução...</code></pre>
      
      <div style="padding: 10px; background: #1a3a2e; border-radius: 5px; margin-top: 15px;">
        <span class="debug-label">🔬 Detalhes da Compilação/Execução</span>
        <pre id="debug-info" style="font-size: 11px; color: #88c968; white-space: pre-wrap;"><span style="color:#888;">O conteúdo será exibido aqui...</span></pre>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xterm/5.3.0/xterm.min.js"></script>
  <script>
    const ws = new WebSocket('ws://' + window.location.host + '/ws');
    
    let currentCompileResult = null;

    // Terminal no console
    const term = new Terminal({
      fontFamily: 'Consolas, monospace',
      fontSize: 14,
      cursorBlinking: true,
      convertEol: false
    });
    const col = term.open({ x: 0, y: 0, cols: 80, rows: window.innerHeight });

    // Auto-resize terminal
    window.addEventListener('resize', () => col.resize());

    ws.onmessage = (msg) => {
      if (msg.data.startsWith('[RUN]')) {
        const runData = JSON.parse(msg.data.slice(5));
        console.log('[RUN]', runData);
        
        term.write('\n');
        term.write(`> Execução do programa completada\n`);
        term.write(`> Código compilado: ${runData.compiled ? '✅' : '❌'}\n`);
        if (runData.error) {
          term.write(`> Erro: ${runData.error}\n`);
        } else if (runData.output) {
          term.write(runData.output);
        }
        
        // Atualizar output pane
        const output = document.getElementById('output-content');
        if (runData.error) {
          output.innerHTML = `<span class="error">❌ ${runData.error}</span>`;
        } else {
          output.innerHTML = runData.output || '<br>Nenhum output gerado';
        }

      } else if (msg.data.startsWith('[COMPILE]')) {
        const compileData = JSON.parse(msg.data.slice(9));
        console.log('[COMPILE]', compileData);

        term.write('\n');
        term.write(`> Compilação iniciada\n`);
        
        setTimeout(() => {
          if (compileData.success) {
            term.write(`✅ Compilação bem-sucedida!\n`);
            term.write(`📦 Tamanho do módulo: ${(compileData.moduleSize || 0).toLocaleString()} bytes\n`);
            
            // Atualizar output pane
            document.getElementById('output-content').innerHTML = `
              <span class="success">✅ Compilação bem-sucedida</span><br>
              📦 Módulo compilado: ${(compileData.moduleSize || 0).toLocaleString()} bytes<br>
              <code># Pronto para execução!</code>
            `;

          } else {
            term.write(`❌ Erro de compilação:\n`);
            if (compileData.errors) {
              compileData.errors.forEach(err => term.write(`  - ${err}\n`));
            } else {
              term.write(`  - ${compileData.error || 'Erro desconhecido'}`);
            }

            document.getElementById('output-content').innerHTML = `
              <span class="error">❌ ${compileData.error}</span>
            `;
          }
        }, 100);
      } else if (msg.data.startsWith('[DEBUG]')) {
        const debugData = JSON.parse(msg.data.slice(7));
        console.log('[DEBUG]', debugData);

        // Atualizar debug info pane
        const debugPane = document.getElementById('debug-info');
        let content = `🔬 Detalhes da Compilação/Execução\n`;
        
        if (compileData) {
          content += `<strong>Compilação:</strong>\n`;
          content += `- Status: ${compileData.success ? 'Sucedido' : 'Falhou'}\n`;
          content += `- Size: ${(compileData.moduleSize || 0).toLocaleString()} bytes\n`;
          
          if (compileData.errors && compileData.errors.length > 0) {
            content += `\n<em>Erros:</em>\n`;
            compileData.errors.forEach(e => content += `  - ${e}\n`);
          }

        } else if (runData) {
          content += `<strong>Execução:</strong>\n`;
          content += `- Código compilado: ${runData.compiled ? 'Sim' : 'Não'}\n`;
          
          if (runData.error) {
            content += `\n<em>Erro:</em><br>`;
            runData.error.split('\n').forEach(line => content += `  - ${line}<br>`);
          } else {
            content += `<br><strong>Output:</strong>\n`;
            if (runData.output) {
              runData.output.split('\n').forEach(line => content += `  > ${line}\n`);
            } else {
              content += 'Nenhum output gerado';
            }
          }
        }

        debugPane.textContent = content.trim();
      }
    };

    // Auto-execute on code change
    setInterval(() => {
      const code = document.getElementById('code-input').value;
      if (ws.readyState === WebSocket.OPEN && ws.protocol === 'json-rpc') {
        console.log(`[AUTO-EXEC] ${code.length} chars`);
        // Execute automaticamente cada X segundos se o usuário não estiver interativo
      }
    }, 1000);

    document.getElementById('run-btn').addEventListener('click', () => {
      const code = document.getElementById('code-input').value;
      ws.send(JSON.stringify({
        method: 'run',
        params: { code, compiledModule: currentCompileResult }
      }));
    });

    document.getElementById('compile-btn').addEventListener('click', () => {
      const code = document.getElementById('code-input').value.trim();
      if (!code) return;

      ws.send(JSON.stringify({
        method: 'compile',
        params: { code },
        id: Date.now()
      }));
    });

    // Auto-save functionality (optional - uncomment to enable)
    /*
    const autoSaveInterval = setInterval(() => {
      console.log('Auto-saved:', document.getElementById('code-input').value);
    }, 30000);
    
    window.addEventListener('beforeunload', () => {
      clearInterval(autoSaveInterval);
    });
    */
  </script>
</body>
</html>
